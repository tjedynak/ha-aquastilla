[project]
name = "ha-aquastilla"
version = "0.0.0"
description = "Home Assistant integration for the Aquastilla DUO Smart water softener"
requires-python = ">=3.14"
dependencies = []

# Tooling only. The integration itself is installed through HACS and gets its
# runtime dependencies from Home Assistant, so nothing is listed above.
[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component",
    "mypy",
    "ruff",
    "pre-commit",
    "detect-secrets",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "C4",       # comprehensions
    "SIM",      # simplify
    "PT",       # pytest style
    "ASYNC",    # async pitfalls
    "S",        # bandit
    "RUF",      # ruff-specific
    "T20",      # no print
    "TID",      # tidy imports
    "PL",       # pylint subset
]
ignore = [
    "PLR2004",  # magic values are fine in tests and thresholds
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0913"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.mypy]
python_version = "3.14"
files = ["custom_components", "scripts", "tests"]
strict = true
warn_unreachable = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "pytest_homeassistant_custom_component.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=custom_components.aquastilla --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
