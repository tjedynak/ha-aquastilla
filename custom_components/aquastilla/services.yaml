rename_device:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: aquastilla
    name:
      required: true
      selector:
        text:

start_remote_service:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: aquastilla
    hours:
      required: true
      default: 12
      selector:
        number:
          min: 1
          max: 23
          mode: box
          unit_of_measurement: h
    confirm:
      required: true
      selector:
        boolean:

end_remote_service:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: aquastilla

pair_device:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: aquastilla
    code:
      required: true
      selector:
        text:
    confirm:
      required: true
      selector:
        boolean:

delete_device:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: aquastilla
    confirm:
      required: true
      selector:
        boolean:
