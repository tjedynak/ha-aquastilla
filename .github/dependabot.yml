version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # The Home Assistant pin is moved by hand together with hacs.json and the CI matrix.
    ignore:
      - dependency-name: homeassistant
      - dependency-name: pytest-homeassistant-custom-component
