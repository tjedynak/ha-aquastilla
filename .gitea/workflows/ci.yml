name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# CI runs on recorded and synthetic fixtures only. It must never reach
# backend.waterlife.pl; tests/test_no_live_traffic.py enforces that.

jobs:
  checks:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install, pre-commit hooks (ruff, mypy, secrets, hygiene) and tests
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          API_URL: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: bash scripts/ci_checks.sh

  pr-metadata:
    name: Pull request title and body
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Check title and Closes reference
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 -m scripts.check_pr_metadata
