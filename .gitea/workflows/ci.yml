name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# CI runs on recorded and synthetic fixtures only. It must never reach
# backend.waterlife.pl; tests/test_no_live_traffic.py enforces that.

jobs:
  checks:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: pip install --user uv && echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Pre-commit hooks (ruff, mypy, secrets, hygiene)
        env:
          SKIP: no-commit-to-branch
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Tests with coverage gate
        run: uv run pytest

  pr-metadata:
    name: Pull request title and body
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Check title and Closes reference
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 -m scripts.check_pr_metadata
